version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_agent
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./agents/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d job_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,ses,secretsmanager,bedrock
      DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack_init.sh:/etc/localstack/init/ready.d/init.sh

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      ENV: local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      DATABASE_URL: postgresql://jobagent:jobagent@postgres:5432/job_agent
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    volumes:
      - ./config:/config
      - ./prompts:/prompts
    command: ["--task", "discovery", "--env", "local"]

volumes:
  postgres_data:
  localstack_data:
