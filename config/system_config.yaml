# =============================================================================
# SYSTEM CONFIGURATION — Infrastructure, scheduling, agent settings
# =============================================================================

aws:
  region: "us-east-1"
  account_id: ""                          # Set via environment variable AWS_ACCOUNT_ID

# ---------------------------------------------------------------------------
# JOB SOURCES — Enable/disable individual sources
# ---------------------------------------------------------------------------
job_sources:
  # Free public APIs — no ToS issues
  remotive:
    enabled: true
    url: "https://remotive.com/api/remote-jobs"
    schedule_hours: 4

  arbeitnow:
    enabled: true
    url: "https://www.arbeitnow.com/api/job-board-api"
    schedule_hours: 4

  the_muse:
    enabled: true
    url: "https://www.themuse.com/api/public/jobs"
    schedule_hours: 6

  # Greenhouse public job boards (no auth required for reading)
  greenhouse:
    enabled: true
    schedule_hours: 4
    # Company tokens are fetched from a maintained list in S3
    company_list_s3_key: "config/greenhouse_companies.json"

  # Lever public job boards (no auth required for reading)
  lever:
    enabled: true
    schedule_hours: 4
    company_list_s3_key: "config/lever_companies.json"

  # Workday (read-only, public postings)
  workday:
    enabled: false                        # Enable after testing
    schedule_hours: 6

  # LinkedIn — requires careful rate limiting, read ToS before enabling
  linkedin:
    enabled: false                        # Manual review required
    schedule_hours: 8

  # Indeed — requires publisher API approval
  indeed:
    enabled: false
    schedule_hours: 6

  # India-specific boards
  naukri:
    enabled: false                        # Requires account
    schedule_hours: 6

  instahyre:
    enabled: false
    schedule_hours: 8

# ---------------------------------------------------------------------------
# SCHEDULING
# ---------------------------------------------------------------------------
scheduling:
  job_discovery_hours: 4
  job_evaluation_minutes: 30
  email_monitoring_minutes: 10
  daily_summary_cron: "0 8 * * ? *"      # 8 AM IST daily (EventBridge cron in UTC: 2:30 AM UTC)
  application_processing_minutes: 15

# ---------------------------------------------------------------------------
# LLM CONFIGURATION
# ---------------------------------------------------------------------------
llm:
  primary_provider: "bedrock"
  primary_model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  fallback_model: "anthropic.claude-3-haiku-20240307-v1:0"
  embedding_model: "amazon.titan-embed-text-v2:0"

  job_matching:
    model: "anthropic.claude-3-haiku-20240307-v1:0"   # Cheaper for high-volume matching
    temperature: 0.1
    max_tokens: 2048

  resume_tailoring:
    model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    temperature: 0.3
    max_tokens: 4096

  cover_letter:
    model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    temperature: 0.4
    max_tokens: 1024

  job_normalization:
    model: "anthropic.claude-3-haiku-20240307-v1:0"
    temperature: 0.0
    max_tokens: 1024

# ---------------------------------------------------------------------------
# DATABASE
# ---------------------------------------------------------------------------
database:
  engine: "postgresql"
  name: "job_agent"
  # Connection string loaded from Secrets Manager at runtime

# ---------------------------------------------------------------------------
# S3 BUCKETS
# ---------------------------------------------------------------------------
s3:
  resumes_bucket: "job-agent-resumes"
  config_bucket: "job-agent-config"
  logs_bucket: "job-agent-logs"

# ---------------------------------------------------------------------------
# SQS QUEUES
# ---------------------------------------------------------------------------
sqs:
  job_discovery_queue: "job-agent-discovery"
  job_evaluation_queue: "job-agent-evaluation"
  application_queue: "job-agent-applications"
  notification_queue: "job-agent-notifications"
  approval_queue: "job-agent-approvals"

# ---------------------------------------------------------------------------
# AGENT SETTINGS
# ---------------------------------------------------------------------------
agents:
  max_retries: 3
  retry_delay_seconds: 30
  job_batch_size: 50
  application_batch_size: 5              # Process 5 applications at a time
  duplicate_check_days: 90               # Don't re-discover jobs seen in last 90 days

  matching:
    high_match_threshold: 80
    medium_match_threshold: 60
    low_match_threshold: 40

  application:
    auto_submit_enabled: false           # Set true only after thorough testing
    max_applications_per_day: 20
    max_applications_per_company_per_month: 3
